<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with dark editorial gradient -->
  <rect width="600" height="600" fill="url(#bg-grad)" rx="16"/>

  <!-- Subtle ambient light blobs -->
  <circle cx="120" cy="120" r="180" fill="#9333EA" fill-opacity="0.28" filter="blur(60px)"/>
  <circle cx="480" cy="480" r="160" fill="#6366F1" fill-opacity="0.2" filter="blur(60px)"/>

  <!-- Grid overlay lines -->
  <path d="M0 100H600M0 200H600M0 300H600M0 400H600M0 500H600" stroke="#FFFFFF" stroke-opacity="0.05" stroke-dasharray="4 4"/>
  <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600" stroke="#FFFFFF" stroke-opacity="0.05" stroke-dasharray="4 4"/>

  <!-- Card Frame Content -->
  <!-- Eyebrow Badge -->
  <rect x="50" y="55" width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="72" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C084FC" letter-spacing="1.5">CAMPAIGN BRIEF</text>

  <!-- Main Headline Text -->
  <text x="50" y="145" font-family="Georgia, serif" font-size="34" font-weight="normal" fill="#FFFFFF" leading="1.2">
    <tspan x="50" dy="0">Turn 1 Prompt into</tspan>
    <tspan x="50" dy="46">a Week of On-Brand</tspan>
    <tspan x="50" dy="46" fill="#A855F7">LinkedIn Posts.</tspan>
  </text>

  <!-- Metric Visual Box -->
  <rect x="50" y="275" width="500" height="200" rx="20" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>

  <!-- Inner Metric 1 -->
  <text x="85" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">3.2x</text>
  <text x="85" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Higher engagement</text>

  <!-- Divider -->
  <line x1="280" y1="305" x2="280" y2="445" stroke="#334155" stroke-width="1.5"/>

  <!-- Inner Metric 2 -->
  <text x="315" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#A855F7">100%</text>
  <text x="315" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">On-brand voice &amp; style</text>

  <!-- Bottom Stat Bar Inside Visual Box -->
  <rect x="85" y="395" width="330" height="8" rx="4" fill="#1E293B"/>
  <rect x="85" y="395" width="280" height="8" rx="4" fill="url(#bar-grad)"/>

  <text x="85" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">AUTOMATED MARKETING DISTRIBUTION</text>

  <!-- Bottom Branding -->
  <circle cx="70" cy="525" r="16" fill="#9333EA"/>
  <text x="65" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">MB</text>

  <text x="98" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">MagicBox AI</text>
  <text x="210" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">" Scheduled directly</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1035"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="85" y1="0" x2="365" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
</svg>
